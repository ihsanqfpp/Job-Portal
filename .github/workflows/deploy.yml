name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install
      
    - name: Typecheck
      run: bun run tsc --noEmit
      
    - name: Lint
      run: bun run lint
      
    - name: Test
      run: bun run test --run
      
    - name: Build
      run: bun run build
